<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Android 10 Browser Sim</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; font-family: sans-serif; overflow: hidden; }

        /* Màn hình điện thoại */
        .phone {
            position: relative; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=1000') center/cover;
            display: flex; flex-direction: column;
        }

        /* Status Bar */
        .status-bar { height: 30px; display: flex; justify-content: space-between; padding: 5px 15px; color: white; font-size: 12px; z-index: 5; }

        /* Home Screen */
        .home { flex: 1; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        .clock { color: white; font-size: 60px; font-weight: 300; margin-bottom: 40px; }
        
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 20px; width: 100%; }
        .app-item { display: flex; flex-direction: column; align-items: center; color: white; font-size: 11px; cursor: pointer; }
        .app-icon { width: 55px; height: 55px; border-radius: 15px; background: white; display: flex; justify-content: center; align-items: center; font-size: 28px; margin-bottom: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        /* Window App (Trình duyệt) */
        .window {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 100; transform: translateY(100%);
            transition: 0.3s cubic-bezier(0, 0, 0.2, 1); display: flex; flex-direction: column;
        }
        .window.open { transform: translateY(0); }

        /* Thanh địa chỉ giống App Google */
        .browser-header { padding: 35px 10px 10px; background: #fff; border-bottom: 1px solid #ddd; display: flex; gap: 8px; }
        .address-bar { flex: 1; background: #f1f3f4; border: none; border-radius: 20px; padding: 8px 15px; outline: none; font-size: 14px; }
        .go-btn { background: #4285F4; color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; }

        /* Nội dung Web */
        .browser-content { flex: 1; width: 100%; border: none; }

        /* Điều hướng Android 10 (Pill) */
        .nav-bar { height: 25px; display: flex; justify-content: center; align-items: center; position: absolute; bottom: 0; width: 100%; cursor: pointer; z-index: 200; }
        .pill { width: 100px; height: 4px; background: white; border-radius: 2px; }
        .window .pill { background: #888; }
    </style>
</head>
<body>

    <div class="phone">
        <div class="status-bar">
            <span id="time">12:00</span>
            <span>📶 🔋 34%</span>
        </div>

        <div class="home">
            <div class="clock" id="big-clock">12:00</div>
            <div class="app-grid">
                <div class="app-item" onclick="toggleBrowser(true)">
                    <div class="icon-wrap"><div class="app-icon">🌐</div></div>
                    <span>Trình duyệt</span>
                </div>
                </div>
        </div>

        <div id="browser" class="window">
            <div class="browser-header">
                <input type="text" id="url-input" class="address-bar" placeholder="Nhập địa chỉ (https://...)" value="https://www.bing.com">
                <button class="go-btn" onclick="loadUrl()">➜</button>
            </div>
            <iframe id="web-frame" class="browser-content" src="about:blank"></iframe>
            
            <div class="nav-bar" onclick="toggleBrowser(false)">
                <div class="pill"></div>
            </div>
        </div>

        <div class="nav-bar">
            <div class="pill"></div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const t = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('time').innerText = t;
            document.getElementById('big-clock').innerText = t;
        }

        function toggleBrowser(show) {
            const win = document.getElementById('browser');
            if(show) {
                win.classList.add('open');
                if(document.getElementById('web-frame').src === "about:blank") loadUrl();
            } else {
                win.classList.remove('open');
            }
        }

        function loadUrl() {
            let url = document.getElementById('url-input').value;
            if (!url.startsWith('http')) url = 'https://' + url;
            document.getElementById('web-frame').src = url;
        }

        // Nhấn Enter để truy cập
        document.getElementById('url-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') loadUrl();
        });

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
  </html>
